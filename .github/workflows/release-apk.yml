name: Build & Publish APK to GitHub Releases

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versión (ej: v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK & Accept Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b1d7f2e51f4076276936418b767786\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b1d7f2e51f4076276936418b767786" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de3760249c54c22703138fdb858778" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment and Signing Keystores
        run: |
          # 1. Asegurar existencia de .env.example y .env para el plugin Secrets
          if [ ! -f .env.example ]; then
            echo "# Environment configuration" > .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # 2. Restaurar o generar debug.keystore
          if [ ! -s debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
            if [ ! -s debug.keystore ]; then
              echo "Generando debug.keystore..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          
          # 3. Generar upload keystore no interactivo para el build release
          if [ ! -s my-upload-key.jks ]; then
            echo "Generando my-upload-key.jks..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=SparkVision, OU=Retail, O=SparkVision, L=Bogota, ST=Bogota, C=CO"
          fi

      - name: Make Gradlew Executable and Fix Line Endings
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build Android APKs (Debug & Release)
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          # 1. Compilar APK Debug (compatible con cualquier celular Android)
          ./gradlew assembleDebug --no-daemon --stacktrace
          
          # 2. Compilar APK Release
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Continuando con APKs generados..."

      - name: Prepare Release APK Files
        run: |
          mkdir -p release-assets
          
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp -v app/build/outputs/apk/debug/app-debug.apk release-assets/SparkVisionStock-debug.apk
          fi
          
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp -v app/build/outputs/apk/release/app-release.apk release-assets/SparkVisionStock-release.apk
          fi
          
          # Copiar cualquier otro APK generado
          find app/build/outputs/apk -type f -name "*.apk" -exec cp -nv {} release-assets/ \;
          
          echo "Contenido de release-assets:"
          ls -lh release-assets/
          
          # Verificar que al menos un APK exista
          if [ -z "$(ls -A release-assets/*.apk 2>/dev/null)" ]; then
            echo "ERROR: No se encontró ningún archivo APK generado."
            exit 1
          fi

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT
          echo "Tag a publicar: $TAG"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: "SparkVision Stock ${{ steps.tag_info.outputs.TAG_NAME }}"
          body: |
            ## 📱 SparkVision Stock — APK Oficial
            Calculadora visual y escáner de productos para tiendas de barrio.
            
            ### 📥 Descargas:
            - **`SparkVisionStock-debug.apk`**: Compatible con cualquier teléfono Android. Instálalo directamente en tu celular.
            - **`SparkVisionStock-release.apk`**: Versión optimizada de producción.
            
            *(Publicado automáticamente en GitHub Releases)*.
          files: release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
